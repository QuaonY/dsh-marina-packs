---
name: 🐛 Bug 报告
description: 报告整合包的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的反馈！请详细描述遇到的问题。

  - type: dropdown
    id: pack
    attributes:
      label: 相关整合包
      description: 哪个整合包有问题？
      options:
        - 所有整合包
        - 特定整合包（在下方说明）
    validations:
      required: true

  - type: input
    id: pack-name
    attributes:
      label: 整合包名称
      description: 如果是特定整合包的问题，请填写名称
      placeholder: "例如：ai-development"

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清楚地描述遇到的问题
      placeholder: |
        我在使用 xxx 整合包时...
        出现了...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？
      placeholder: |
        1. 导入整合包
        2. 创建实例
        3. 启动后...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？

  - type: input
    id: marina-version
    attributes:
      label: Marina 版本
      description: 使用的 DSH Marina 版本
      placeholder: "例如：v0.1.0"

  - type: input
    id: runtime-version
    attributes:
      label: 运行时版本
      description: 使用的 DSH 运行时版本
      placeholder: "例如：2.5.0"

  - type: textarea
    id: additional
    attributes:
      label: 其他信息
      description: 截图、日志或其他有用的信息
