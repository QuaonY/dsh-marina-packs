name: Validate Pack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packs/**'
      - 'index.json'
      - 'schema.json'
      - 'scripts/**'
  push:
    branches:
      - master
    paths:
      - 'packs/**'
      - 'index.json'
      - 'schema.json'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  # 分支保护的必需检查是 job 的 name “Validate pack.json”；job id 只是内部标识。
  # 改 name 必须同步修改仓库分支保护，否则所有 PR 会卡在 pending。
  validate:
    name: Validate pack.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PR 里的 scripts/ 和 schema.json 不可信：校验逻辑一律用目标分支的版本。
      - name: Use trusted validator from the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git checkout FETCH_HEAD -- scripts schema.json

      - name: Validate catalog (index.json, packs/, sensitive data)
        run: node scripts/validate-catalog.mjs

      - name: Install AJV
        run: npm install --global ajv-cli@5

      - name: Validate every pack.json against schema.json
        run: |
          set -euo pipefail
          shopt -s nullglob

          found=0
          for file in packs/*/pack.json; do
            name=$(basename "$(dirname "$file")")
            case "$name" in
              example-*|_*|.*) continue ;;
            esac
            found=$((found + 1))
            echo "Validating $file"
            ajv validate -s schema.json -d "$file" --strict=false
          done

          echo "Validated $found pack.json file(s)"
